<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Synagogue Message Board</title>

  <style>
    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#020202;
    }

    #boardFrame{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      border:0;
      display:block;
      background:#020202;
    }

    #bootStatus{
      position:fixed;
      inset:0;
      z-index:999999;
      display:grid;
      place-items:center;
      background:#020202;
      color:#f5c842;
      font-family:Arial,"Noto Sans Hebrew",sans-serif;
      font-size:clamp(18px,3vw,34px);
      font-weight:900;
      text-align:center;
      transition:opacity .35s ease;
    }

    #bootStatus.hidden{
      opacity:0;
      pointer-events:none;
    }

    @media(prefers-reduced-motion:reduce){
      *{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
        scroll-behavior:auto!important;
      }
    }
  </style>
</head>

<body>

  <div id="bootStatus">
    טוען את לוח המודעות...
  </div>

  <iframe
    id="boardFrame"
    title="לוח מודעות בית הכנסת"
    src="./index4.html"
    loading="eager"
    allow="autoplay; fullscreen"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

<script>
(function(){

  "use strict";

  const frame = document.getElementById("boardFrame");
  const boot  = document.getElementById("bootStatus");

  /*
   * SAFETY MODEL
   * ---------------------------------------------------------
   * index4.html remains the original application..
   *
   * This file patches presentation/runtime behavior after the
   * original application has loaded.
   *
   * If anything unexpected happens in the patch layer, the
   * original board remains available inside the iframe.
   */

  const PATCH_VERSION = "2026.08.28-safe-presentation-1";

  function hideBoot(){
    if(!boot) return;
    boot.classList.add("hidden");
    setTimeout(function(){
      if(boot && boot.parentNode) boot.remove();
    },500);
  }

  function waitForBoard(callback){
    let attempts = 0;

    const timer = setInterval(function(){

      attempts++;

      try{
        const win = frame.contentWindow;
        const doc = win && win.document;

        if(
          doc &&
          doc.readyState !== "loading" &&
          doc.getElementById("featureRotator") &&
          typeof win.renderFeatureRotation === "function"
        ){
          clearInterval(timer);
          callback(win,doc);
          return;
        }
      }catch(err){
        /*
         * Same-origin is expected because index4.html is hosted
         * beside this file. If hosting changes, simply leave the
         * original index4.html available.
         */
      }

      if(attempts > 120){
        clearInterval(timer);
        hideBoot();
      }

    },250);
  }

  frame.addEventListener("load",function(){
    waitForBoard(applyRepairs);
  });

  /*
   * ---------------------------------------------------------
   * MAIN PATCH
   * ---------------------------------------------------------
   */

  function applyRepairs(win,doc){

    hideBoot();

    try{

      /*
       * Make the patch version visible for QA/debugging.
       */
      win.__SAFE_BOARD_PATCH_VERSION = PATCH_VERSION;

      /*
       * -----------------------------------------------------
       * 1. HARDENED FEATURE TIMINGS
       * -----------------------------------------------------
       *
       * Original source:
       * main      30 sec
       * memorial  30 sec
       * shiur     30 sec
       * daf       30 sec
       *
       * New:
       * main      45 sec
       * memorial  30 sec
       * shiur     45 sec
       * daf       60 sec
       */

      if(Array.isArray(win.FEATURE_SEQUENCE)){

        const durations = {
          main:45000,
          memorial:30000,
          shiur:45000,
          daf:60000
        };

        win.FEATURE_SEQUENCE.forEach(function(item){
          if(item && durations[item.mode]){
            item.duration = durations[item.mode];
          }
        });
      }


      /*
       * -----------------------------------------------------
       * 2. FEATURE STATE
       * -----------------------------------------------------
       */

      let currentFeature = "main";

      win.__safeFeatureActive = false;

      function getFeatureMode(){

        try{
          if(
            Array.isArray(win.FEATURE_SEQUENCE) &&
            typeof win.featureSequenceIndex === "number"
          ){
            return win.FEATURE_SEQUENCE[
              win.featureSequenceIndex
            ]?.mode || "main";
          }
        }catch(e){}

        return "main";
      }


      /*
       * -----------------------------------------------------
       * 3. CSS HARDENING
       * -----------------------------------------------------
       */

      const style = doc.createElement("style");

      style.id = "safe-presentation-patch";

      style.textContent = `
        /*
         * Safe feature presentation
         */
        html.safe-feature-active,
        body.safe-feature-active{
          overflow:hidden!important;
          overscroll-behavior:none!important;
        }

        body.safe-feature-active{
          touch-action:none;
        }

        #featureRotator.feature-mode{
          position:fixed!important;
          inset:0!important;
          width:100vw!important;
          height:100vh!important;
          max-width:none!important;
          max-height:none!important;
          margin:0!important;
          z-index:2147483000!important;
          overflow:auto!important;
          overscroll-behavior:contain!important;
          -webkit-overflow-scrolling:touch;
        }

        #featureRotator.feature-mode .feature-view{
          min-height:100%;
          width:100%;
        }

        #featureRotator.feature-mode #dafYomiView,
        #featureRotator.feature-mode #dailyShiurView,
        #featureRotator.feature-mode #memorialView{
          min-height:100vh;
        }

        /*
         * Prevent background UI from competing visually.
         */
        body.safe-feature-active #prayerPanel{
          display:none!important;
          visibility:hidden!important;
          pointer-events:none!important;
        }

        body.safe-feature-active .biblical-showcase,
        body.safe-feature-active .tribes,
        body.safe-feature-active .announcement-wrap,
        body.safe-feature-active .ticker-wrap{
          /*
           * Do not remove these nodes.
           * Simply stop their animation and background activity.
           */
          animation-play-state:paused!important;
        }

        body.safe-feature-active iframe#dafVideo{
          display:block;
        }

        /*
         * Full-screen feature typography.
         */
        #featureRotator.feature-mode .daily-shiur{
          min-height:calc(100vh - 20px)!important;
          display:flex!important;
          flex-direction:column!important;
          justify-content:center!important;
        }

        #featureRotator.feature-mode #memorialView{
          display:flex!important;
          align-items:center!important;
          justify-content:center!important;
        }

        #featureRotator.feature-mode #dafYomiView{
          display:flex!important;
          align-items:stretch!important;
        }

        /*
         * Accessibility / reduced motion.
         */
        @media(prefers-reduced-motion:reduce){

          #featureRotator *,
          #featureRotator *::before,
          #featureRotator *::after{
            animation-duration:.01ms!important;
            animation-iteration-count:1!important;
            transition-duration:.01ms!important;
          }
        }

        /*
         * Small screen protection.
         */
        @media(max-width:850px){

          #featureRotator.feature-mode{
            padding:12px!important;
          }

          #featureRotator.feature-mode .daily-shiur{
            min-height:calc(100vh - 24px)!important;
          }
        }
      `;

      doc.head.appendChild(style);


      /*
       * -----------------------------------------------------
       * 4. ENTER / EXIT FEATURE STATE
       * -----------------------------------------------------
       */

      function unloadDafVideo(){

        const frameEl = doc.getElementById("dafVideo");

        if(!frameEl) return;

        try{
          /*
           * about:blank immediately releases the YouTube
           * document and its resources.
           */
          frameEl.src = "about:blank";
        }catch(e){}

        frameEl.style.display = "none";

        const empty = doc.getElementById("dafVideoEmpty");

        if(empty){
          empty.style.display = "grid";
        }
      }


      function restoreDafVideo(){

        try{
          if(typeof win.applyDafVideo === "function"){
            win.applyDafVideo();
          }
        }catch(e){}
      }


      function pauseBackground(){

        try{
          doc.body.classList.add("pause-marquees");
          doc.body.classList.add("pause-decorative");
        }catch(e){}
      }


      function resumeBackground(){

        try{
          doc.body.classList.remove("pause-marquees");
          doc.body.classList.remove("pause-decorative");
        }catch(e){}
      }


      function enterFeature(mode){

        const wasFeature = win.__safeFeatureActive;
        const previous = currentFeature;

        currentFeature = mode;

        win.__safeFeatureActive = mode !== "main";

        const html = doc.documentElement;
        const body = doc.body;
        const rotator = doc.getElementById("featureRotator");

        if(win.__safeFeatureActive){

          html.classList.add("safe-feature-active");
          body.classList.add("safe-feature-active");

          /*
           * Stop the original document auto-scroll from
           * moving the board underneath the feature.
           */
          try{
            win.scrollTo(0,0);
          }catch(e){}

          if(rotator){
            try{
              rotator.scrollTop = 0;
              rotator.scrollLeft = 0;
            }catch(e){}
          }

          /*
           * Prayer overlay must never cover a feature page.
           */
          try{
            if(typeof win.hidePrayerPanel === "function"){
              win.hidePrayerPanel();
            }
          }catch(e){}

          pauseBackground();

          /*
           * If we are entering Daf Yomi, restore its video
           * only now. This avoids keeping YouTube alive all
           * the time.
           */
          if(mode === "daf"){
            restoreDafVideo();
          }

          /*
           * If switching from Daf to another feature, unload.
           */
          if(previous === "daf" && mode !== "daf"){
            unloadDafVideo();
          }

        }else{

          html.classList.remove("safe-feature-active");
          body.classList.remove("safe-feature-active");

          /*
           * Leaving Daf.
           */
          if(previous === "daf"){
            unloadDafVideo();
          }

          resumeBackground();

          try{
            win.scrollTo(0,0);
          }catch(e){}
        }

        /*
         * Defensive re-evaluation of prayer state only when
         * returning to the main board.
         */
        if(mode === "main"){

          try{
            if(typeof win.updatePrayerOverlay === "function"){
              win.updatePrayerOverlay();
            }
          }catch(e){}
        }

        /*
         * Ensure the feature itself is internally at the top.
         */
        if(rotator && mode !== "main"){

          requestAnimationFrame(function(){
            try{
              rotator.scrollTop = 0;
            }catch(e){}
          });

        }
      }


      /*
       * -----------------------------------------------------
       * 5. WRAP THE EXISTING FEATURE RENDERER
       * -----------------------------------------------------
       *
       * We retain the original renderer.
       * This is important for safety.
       */

      const originalRenderFeatureRotation =
        win.renderFeatureRotation;

      if(typeof originalRenderFeatureRotation === "function"){

        win.renderFeatureRotation = function(){

          try{
            originalRenderFeatureRotation.call(win);
          }finally{
            enterFeature(getFeatureMode());
          }
        };
      }


      /*
       * -----------------------------------------------------
       * 6. MANUAL FEATURE BUTTONS
       * -----------------------------------------------------
       */

      const originalSetFeatureSequenceMode =
        win.setFeatureSequenceMode;

      if(typeof originalSetFeatureSequenceMode === "function"){

        win.setFeatureSequenceMode = function(mode){

          try{

            originalSetFeatureSequenceMode.call(win,mode);

          }finally{

            /*
             * The original renderer will run first.
             * We then enforce the safe state.
             */
            setTimeout(function(){
              enterFeature(mode || "main");
            },0);
          }
        };
      }


      /*
       * -----------------------------------------------------
       * 7. STOP FEATURE DISPLAY
       * -----------------------------------------------------
       */

      const originalStopFeatureDisplay =
        win.stopFeatureDisplay;

      if(typeof originalStopFeatureDisplay === "function"){

        win.stopFeatureDisplay = function(){

          try{

            originalStopFeatureDisplay.call(win);

          }finally{

            enterFeature("main");

          }
        };
      }


      /*
       * -----------------------------------------------------
       * 8. INITIAL STATE
       * -----------------------------------------------------
       */

      setTimeout(function(){

        try{

          const mode = getFeatureMode();

          currentFeature = mode;

          enterFeature(mode);

          /*
           * Make sure the first YouTube frame isn't running
           * while the board is on Main.
           */
          if(mode !== "daf"){
            unloadDafVideo();
          }

        }catch(e){}

      },100);


      /*
       * -----------------------------------------------------
       * 9. DATE-SAFE CANDLE / HAVDALAH CACHE
       * -----------------------------------------------------
       *
       * The original code can carry candle/havdalah values
       * from an earlier cache object. We replace only that
       * function, leaving the rest of the zmanim pipeline.
       */

      if(typeof win.refreshZmanim === "function"){

        win.refreshZmanim = async function(force){

          try{

            if(
              !force &&
              win.boardControlState &&
              win.boardControlState.liveUpdates === false
            ){
              return;
            }

            if(
              (win.settings?.zmanimMode || "auto") === "manual"
            ){

              if(typeof win.applyZmanimValues === "function"){
                win.applyZmanimValues(
                  typeof win.manualZmanimValues === "function"
                    ? win.manualZmanimValues()
                    : {},
                  "זמנים ידניים — נשמרו במכשיר"
                );
              }

              return;
            }

            const date =
              typeof win.localISO === "function"
                ? win.localISO()
                : new Intl.DateTimeFormat(
                    "en-CA",
                    {
                      timeZone:
                        win.settings?.timezone ||
                        "America/New_York",
                      year:"numeric",
                      month:"2-digit",
                      day:"2-digit"
                    }
                  ).format(new Date());

            const end =
              typeof win.plusDays === "function"
                ? win.plusDays(date,14)
                : date;

            let cached = {};

            try{
              cached = JSON.parse(
                localStorage.getItem(
                  "synagogueBoardZmanimCache"
                ) || "{}"
              );
            }catch(e){
              cached = {};
            }

            /*
             * Only accept candle/havdalah data if it belongs
             * to THIS exact local date.
             */
            const sameDate =
              cached &&
              cached.date === date;

            const values = {
              alot:"--:--",
              sunrise:"--:--",
              shema:"--:--",
              chatzot:"--:--",
              minchaGedola:"--:--",
              sunset:"--:--",
              tzeit:"--:--",
              candles:
                sameDate && cached.values
                  ? cached.values.candles || "--:--"
                  : "--:--",
              havdalah:
                sameDate && cached.values
                  ? cached.values.havdalah || "--:--"
                  : "--:--"
            };

            const rawValues = {
              candles:
                sameDate && cached.rawValues
                  ? cached.rawValues.candles || ""
                  : "",
              havdalah:
                sameDate && cached.rawValues
                  ? cached.rawValues.havdalah || ""
                  : ""
            };

            const zmanimResponse = await fetch(
              "https://www.hebcal.com/zmanim?cfg=json" +
              "&zip=" +
              encodeURIComponent(
                win.settings?.zip || "11795"
              ) +
              "&date=" + encodeURIComponent(date),
              {
                cache:"no-store"
              }
            );

            if(!zmanimResponse.ok){
              throw new Error("Zmanim request failed");
            }

            const data = await zmanimResponse.json();
            const t = data.times || {};

            const timeOnly =
              typeof win.timeOnly === "function"
                ? win.timeOnly
                : function(v){
                    if(!v) return "--:--";
                    return String(v)
                      .replace(/^.*T/,"")
                      .slice(0,5);
                  };

            rawValues.alot = t.alotHaShachar;
            rawValues.sunrise = t.sunrise;
            rawValues.shema = t.sofZmanShma;
            rawValues.chatzot = t.chatzot;
            rawValues.minchaGedola = t.minchaGedola;
            rawValues.sunset = t.sunset;
            rawValues.tzeit =
              t.tzeit7083deg ||
              t.tzeit85deg ||
              t.tzeit;

            values.alot = timeOnly(rawValues.alot);
            values.sunrise = timeOnly(rawValues.sunrise);
            values.shema = timeOnly(rawValues.shema);
            values.chatzot = timeOnly(rawValues.chatzot);
            values.minchaGedola =
              timeOnly(rawValues.minchaGedola);
            values.sunset = timeOnly(rawValues.sunset);
            values.tzeit = timeOnly(rawValues.tzeit);

            /*
             * Get candles/Havdalah from the calendar API.
             * IMPORTANT: no previous-date candle is used.
             */
            try{

              const calendarResponse = await fetch(
                "https://www.hebcal.com/hebcal?v=1" +
                "&cfg=json" +
                "&start=" + encodeURIComponent(date) +
                "&end=" + encodeURIComponent(end) +
                "&zip=" +
                encodeURIComponent(
                  win.settings?.zip || "11795"
                ) +
                "&c=on&lg=he",
                {
                  cache:"no-store"
                }
              );

              if(calendarResponse.ok){

                const calendar =
                  await calendarResponse.json();

                const items =
                  Array.isArray(calendar.items)
                    ? calendar.items
                    : [];

                /*
                 * Only use the candle event whose date
                 * matches the board's local date or whose
                 * event is explicitly associated with the
                 * upcoming/current Shabbat.
                 */
                const candle =
                  items.find(function(item){

                    return (
                      item.category === "candles" &&
                      String(item.date || "").slice(0,10) >= date
                    );

                  });

                const havdalah =
                  items.find(function(item){

                    return (
                      item.category === "havdalah" &&
                      String(item.date || "").slice(0,10) >= date
                    );

                  });

                if(
                  candle &&
                  typeof win.calendarEventTime === "function"
                ){
                  values.candles =
                    win.calendarEventTime(candle) ||
                    "--:--";

                  rawValues.candles =
                    candle.date || "";
                }

                if(
                  havdalah &&
                  typeof win.calendarEventTime === "function"
                ){
                  values.havdalah =
                    win.calendarEventTime(havdalah) ||
                    "--:--";

                  rawValues.havdalah =
                    havdalah.date || "";
                }
              }

            }catch(calendarError){

              /*
               * If today's calendar request fails,
               * retain today's cached candle data only.
               */
            }

            const location =
              data.location?.title ||
              win.settings?.zip ||
              "11795";

            const cache = {
              date:date,
              values:values,
              rawValues:rawValues,
              location:location,
              updatedAt:new Date().toISOString()
            };

            try{
              localStorage.setItem(
                "synagogueBoardZmanimCache",
                JSON.stringify(cache)
              );
            }catch(e){}

            if(
              typeof win.applyZmanimValues === "function"
            ){

              win.applyZmanimValues(
                values,
                "עדכון אוטומטי: " +
                location +
                " • " +
                date,
                rawValues
              );
            }

          }catch(error){

            /*
             * Safe fallback:
             * only use cache if it belongs to the current
             * local date. Never show yesterday's candle time.
             */

            let cached = {};

            try{
              cached = JSON.parse(
                localStorage.getItem(
                  "synagogueBoardZmanimCache"
                ) || "{}"
              );
            }catch(e){}

            const date =
              typeof win.localISO === "function"
                ? win.localISO()
                : "";

            if(
              cached &&
              cached.date === date &&
              cached.values &&
              typeof win.applyZmanimValues === "function"
            ){

              win.applyZmanimValues(
                cached.values,
                "זמנים שמורים מהעדכון האחרון • " +
                date,
                cached.rawValues || cached.values
              );

            }else if(
              typeof win.applyZmanimValues === "function"
            ){

              win.applyZmanimValues(
                {},
                "לא ניתן לטעון זמנים אוטומטיים כרגע"
              );
            }
          }
        };
      }


      /*
       * -----------------------------------------------------
       * 10. SINGLE AUTHORITATIVE DAF FALLBACK
       * -----------------------------------------------------
       *
       * Hebcal's normal calendar request already supplies
       * Daf Yomi. We no longer make a second Daf-only API
       * request every 30 minutes.
       */

      if(typeof win.builtInDafYomi === "function"){

        win.refreshDafYomiFallback = function(){

          if(
            win.boardControlState &&
            win.boardControlState.liveUpdates === false
          ){
            return;
          }

          const ids = [
            "dafYomi",
            "dailyDaf",
            "permanentDafYomi"
          ];

          const elements = ids
            .map(function(id){
              return doc.getElementById(id);
            })
            .filter(Boolean);

          if(!elements.length) return;

          /*
           * Only provide fallback when the element does not
           * already contain valid live data.
           */
          const localValue =
            win.builtInDafYomi(
              typeof win.localISO === "function"
                ? win.localISO()
                : undefined
            );

          elements.forEach(function(el){

            const current =
              String(el.textContent || "").trim();

            if(
              !current ||
              current === "טוען..." ||
              current === "—"
            ){
              el.textContent = localValue;
            }

          });

        };
      }


      /*
       * -----------------------------------------------------
       * 11. LOCATION HARDENING
       * -----------------------------------------------------
       *
       * We preserve an explicitly configured admin location.
       * If no usable location exists, fall back to the board's
       * existing 11795 / America-New_York configuration.
       */

      try{

        if(win.settings){

          if(
            !String(win.settings.zip || "").trim()
          ){
            win.settings.zip = "11795";
          }

          if(
            !String(win.settings.timezone || "").trim()
          ){
            win.settings.timezone =
              "America/New_York";
          }

        }

      }catch(e){}


      /*
       * Add a clear location indicator without changing
       * existing dashboard structure.
       */

      function addLocationIndicator(){

        try{

          const existing =
            doc.getElementById(
              "safeLocationIndicator"
            );

          if(existing) return;

          const indicator =
            doc.createElement("div");

          indicator.id =
            "safeLocationIndicator";

          indicator.textContent =
            "LOCAL • " +
            (win.settings?.zip || "11795") +
            " • " +
            (win.settings?.timezone ||
             "America/New_York");

          Object.assign(
            indicator.style,
            {
              position:"fixed",
              right:"14px",
              bottom:"14px",
              zIndex:"2147483640",
              padding:"5px 10px",
              border:"1px solid rgba(245,200,66,.45)",
              borderRadius:"999px",
              background:"rgba(0,0,0,.65)",
              color:"rgba(255,255,255,.65)",
              fontFamily:
                'Arial,"Noto Sans Hebrew",sans-serif',
              fontSize:"11px",
              fontWeight:"700",
              direction:"ltr",
              pointerEvents:"none",
              opacity:"0.65"
            }
          );

          doc.body.appendChild(indicator);

        }catch(e){}
      }

      addLocationIndicator();


      /*
       * -----------------------------------------------------
       * 12. PREVENT PRAYER OVERLAY FROM REAPPEARING
       * -----------------------------------------------------
       *
       * The original page checks prayer state every second.
       * Instead of replacing that timer, we make its output
       * harmless while a feature is active.
       */

      if(typeof win.updatePrayerOverlay === "function"){

        const originalPrayerOverlay =
          win.updatePrayerOverlay;

        win.updatePrayerOverlay = function(){

          if(win.__safeFeatureActive){

            try{
              if(typeof win.hidePrayerPanel === "function"){
                win.hidePrayerPanel();
              }
            }catch(e){}

            return;
          }

          return originalPrayerOverlay.apply(
            win,
            arguments
          );
        };
      }


      /*
       * -----------------------------------------------------
       * 13. REDUCE BACKGROUND ANIMATION DURING FEATURES
       * -----------------------------------------------------
       */

      const originalRotateBiblicalScenes =
        win.rotateBiblicalScenes;

      if(typeof originalRotateBiblicalScenes === "function"){

        win.rotateBiblicalScenes = function(){

          if(win.__safeFeatureActive){
            return;
          }

          return originalRotateBiblicalScenes.apply(
            win,
            arguments
          );
        };
      }


      /*
       * -----------------------------------------------------
       * 14. MAIN DOCUMENT AUTO-SCROLL GUARD
       * -----------------------------------------------------
       *
       * The original application has a requestAnimationFrame
       * auto-scroll loop. We don't destroy it.
       *
       * We simply force the window to remain at 0 while a
       * full-screen feature is active.
       */

      let lastForcedScroll = 0;

      function featureScrollGuard(){

        if(win.__safeFeatureActive){

          const now = Date.now();

          if(now - lastForcedScroll > 250){

            lastForcedScroll = now;

            try{
              if(
                Math.abs(
                  Number(win.scrollY || 0)
                ) > 1
              ){
                win.scrollTo(0,0);
              }
            }catch(e){}
          }
        }

        requestAnimationFrame(featureScrollGuard);
      }

      requestAnimationFrame(featureScrollGuard);


      /*
       * -----------------------------------------------------
       * 15. VISIBILITY / RETURN-FROM-SLEEP RECOVERY
       * -----------------------------------------------------
       *
       * TVs and kiosk browsers sometimes suspend timers.
       */

      doc.addEventListener(
        "visibilitychange",
        function(){

          if(
            !doc.hidden &&
            win.__safeFeatureActive
          ){

            setTimeout(function(){

              try{

                const mode = getFeatureMode();

                enterFeature(mode);

                if(
                  mode === "daf"
                ){
                  restoreDafVideo();
                }

              }catch(e){}

            },150);
          }

        }
      );


      /*
       * -----------------------------------------------------
       * 16. RESIZE RECOVERY
       * -----------------------------------------------------
       */

      win.addEventListener(
        "resize",
        function(){

          if(win.__safeFeatureActive){

            setTimeout(function(){

              try{
                win.scrollTo(0,0);

                const rotator =
                  doc.getElementById(
                    "featureRotator"
                  );

                if(rotator){
                  rotator.scrollTop = 0;
                }

              }catch(e){}

            },50);
          }

        }
      );


      /*
       * -----------------------------------------------------
       * 17. SAFETY LOG
       * -----------------------------------------------------
       */

      console.info(
        "[Synagogue Board]",
        "Safe presentation patch active:",
        PATCH_VERSION
      );

      /*
       * Final state synchronization.
       */

      setTimeout(function(){

        try{

          const mode = getFeatureMode();

          enterFeature(mode);

          if(
            typeof win.applySettings === "function"
          ){
            win.applySettings();
          }

          if(
            typeof win.refreshZmanim === "function"
          ){
            win.refreshZmanim(true);
          }

          if(
            typeof win.refreshDafYomiFallback === "function"
          ){
            win.refreshDafYomiFallback();
          }

        }catch(e){

          console.warn(
            "[Synagogue Board] Final patch sync failed",
            e
          );

        }

      },500);


    }catch(error){

      console.error(
        "[Synagogue Board] Safe patch failed:",
        error
      );

      /*
       * IMPORTANT:
       * We intentionally do NOT remove the original board.
       * index4.html continues running.
       */

    }

  }

})();
</script>
